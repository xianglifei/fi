# fi-sidebar —— dsh bundle patch（激活声明）
# dsh 启动时按 bundle 层栈叠加各插件 patch；本文件把插件插进 fi profile 的配置树，
# 只有出现在配置树里的插件，其 dsh.client 客户端半层才会被 boot 扫描装载。
#
# 本地开发安装（fi 主进程启动时也会自动执行）：
#   dsh plugin --profile fi add link:<本目录绝对路径>
- insert:
    - id: fi-sidebar
      name: fi-sidebar
# 打开会话全文搜索索引：dsh 出厂 web 模板把 session-query-sqlite 配成
# openAt: never + :memory:（搜索是 opt-in 的），fi 依赖内容搜索，这里按同 id
# 覆盖为启动即开、落盘到 dsh 家目录（索引是派生库，与会话日志同级共享）。
- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: !!js dshHomePath('session-query.db')
    openAt: startup
